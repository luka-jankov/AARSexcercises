  <body>
    <h1>SUPIT - oznaka &lt;table&gt;</h1>
    <h2>Elementi oznake &lt;table&gt;:</h2>

    <ol>
      <li>Element &lt;<b>caption</b>&gt;</li>

      <li>
        Elementi za grupiranje redaka:
        <ol type="a">
          <li>&lt;<b>thead</b>&gt;</li>
          <li>&lt;<b>tbody</b>&gt;</li>
          <li>&lt;<b>tfoot</b>&gt;</li>
        </ol>
      </li>

      <li>
        Elementi za definiranje retka &lt;<b>tr</b>&gt;
        <ul>
          <li>&lt;<b>th</b>&gt; -naslovna ćelija;</li>
          <li>&lt;<b>td</b>&gt; -ćelija</li>
        </ul>
      </li>
    </ol>
  </body>
